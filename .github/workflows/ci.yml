name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx prisma generate
      - run: npx prisma db push
      - name: Format check
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Security audit (dependencies)
        run: npm audit --audit-level=high || echo "::warning::Known Prisma CLI advisory GHSA-ggr8-5vv4-36mx, see README"
      - name: Build
        run: npm run build

  docker:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: library-management:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security scan (Trivy)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed library-management:ci

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

